# Publishes the site to GitHub Pages on every push.
#
# SWITCHED ON ONCE, BY HAND:
#   Repository -> Settings -> Pages -> Build and deployment -> Source
#   Set it to "GitHub Actions".
#
# That has to be done in the settings because the token this workflow runs
# with is not allowed to create a Pages site itself. Once the site exists,
# this workflow only reads its configuration and publishes to it, which it
# is allowed to do, and nothing else needs touching again.
#
# After that, adding a project or a photograph and pushing it is the whole
# deploy process. The typecheck and the lint run before the build, so a
# mistake in a content file fails here and the published site is left as it
# was.
#
# ONE THING TO KNOW IF THIS REPOSITORY IS EVER MADE PRIVATE:
#   Pages is free for public repositories, but a private one needs GitHub Pro
#   or above, and this workflow will fail at "Configure Pages". Netlify and
#   Vercel both publish from a private repository for free, and both rewrite
#   addresses properly, which is tidier than the 404.html this build writes.

name: Deploy to GitHub Pages

# Only main: the github-pages environment only ever accepts a deployment
# from the repository's default branch, so a run triggered by a push to a
# claude/** feature branch always reaches the deploy job and fails there.
# Worse, every deploy shares one concurrency group with cancel-in-progress,
# so a feature-branch push made shortly after a push to main can cancel
# that main run before it finishes, leaving nothing actually published.
# Restricting the trigger to main avoids both.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# The permissions the Pages deployment needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push cancels a run still in progress.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # A project site is served from /<repository-name>/, so the build is
        # told where it will live. The router and every asset path follow.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v6
        # `enablement: true` would turn Pages on from here, but the token this
        # workflow runs with is not allowed to create a Pages site on this
        # repository, so it fails with "Resource not accessible by
        # integration". Pages is switched on once by hand instead; see the
        # note at the top of this file. After that this step only reads the
        # configuration, which it is allowed to do.

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
