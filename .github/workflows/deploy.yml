# Publishes the site to GitHub Pages on every push.
#
# There is nothing to set up. The `enablement` setting below turns Pages on
# by itself, so no switch has to be found in the repository settings.
#
# Adding a project or a photograph and pushing it is the whole deploy
# process. The typecheck and the lint run before the build, so a mistake in
# a content file fails here and the published site is left as it was.
#
# ONE THING TO KNOW IF THIS REPOSITORY IS EVER MADE PRIVATE:
#   Pages is free for public repositories, but a private one needs GitHub Pro
#   or above, and this workflow will fail at "Configure Pages". Netlify and
#   Vercel both publish from a private repository for free, and both rewrite
#   addresses properly, which is tidier than the 404.html this build writes.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

# The permissions the Pages deployment needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push cancels a run still in progress.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # A project site is served from /<repository-name>/, so the build is
        # told where it will live. The router and every asset path follow.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for this repository if it is not on already, so
          # nothing has to be switched on by hand. It still needs Pages to be
          # available for the repository: see the note at the top of the file.
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
